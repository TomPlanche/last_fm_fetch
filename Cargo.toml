[package]
name = "lastfm-client"
version = "3.0.0"
edition = "2024"
description = "A modern, async Rust library for fetching and analyzing Last.fm user data"
license = "MIT"
repository = "https://github.com/TomPlanche/lastfm-client"
keywords = ["lastfm", "api", "async", "music", "scrobble"]
categories = ["api-bindings", "web-programming"]

[dependencies]
async-trait = "0.1"
chrono = "0.4.43"
csv = "1.4.0"
dotenv = "0.15.0"
futures = "0.3.31"
parking_lot = "0.12"
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["full", "test-util", "rt-multi-thread"] }
