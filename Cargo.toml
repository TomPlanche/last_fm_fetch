[package]
name = "async_lastfm"
version = "1.0.0"
edition = "2021"

[dependencies]
chrono = "0.4.42"
csv = "1.4.0"
dotenv = "0.15.0"
futures = "0.3.31"
mockito = "1.7.0"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tabular = "0.2.0"
tokio = { version = "1.48.0", features = ["full"] }
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full", "test-util", "rt-multi-thread"] }
